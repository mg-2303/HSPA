<div class="row">
  <div class="col-6 m-auto">
    <div class="card m-auto">
      <div class="card-header">Login</div>
      <div class="card-body">
        <form (ngSubmit)="onLogin(loginForm)" #loginForm="ngForm">
          <div class="form-group col-12">
            <label for="name" class="form-label">Username</label>
            <input type="text" class="form-control" ngModel name="userName" required />
            <!-- @if (userName.invalid && (userName.touched || isFormSubmitted)) {
              <span class="error-block">Pls provide username</span>
            } -->
          </div>

          <div class="form-group col-12">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" ngModel name="password" required />
            <!-- @if (email.invalid && (email.touched || isFormSubmitted)) {
              @if (email.hasError("required")) {
                <span class="error-block"> Pls provide email </span>
              }

              @if (email.hasError("email")) {
                <span class="error-block"> Pls provide valid email </span>
              }
            } -->
          </div>

          <div class="form-group col-12 mt-3">
            <button [disabled]="loginForm.invalid" type="submit" class="btn btn-primary">
              Login
            </button>
            <button type="reset" class="btn btn-secondary ms-2">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
