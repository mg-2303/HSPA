<div class="card">
  <div class="card-img-wrapper">
    @if (!propertyCard.imageName) {
      <img class="card-img-top" src="assets/images/house_default.png" alt="demo property card" />
    }
    @if (propertyCard.imageName) {
      <img
        class="card-img-top"
        src="assets/images/{{ propertyCard.imageName }}.png"
        alt="demo property card"
      />
    }
    <ul class="list-inline member-icons text-center animate">
      <li class="list-inline-item">
        <button class="btn btn-primary" [routerLink]="[DETAILS_PROPERTY, propertyCard.id]">
          <i class="fa-solid fa-pen-to-square"></i>
        </button>
      </li>
      <li class="list-inline-item">
        <button class="btn btn-primary"><i class="fa-solid fa-address-book"></i></button>
      </li>
    </ul>
  </div>
  <div class="property-body p-2">
    <h2>{{ propertyCard.type }}</h2>
    <h2>{{ propertyCard.name }}</h2>
    <h2>{{ propertyCard.price }}</h2>
  </div>
</div>
